<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tentang Kelompok</title>
    <!-- Import Google Font: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,
        html {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b1329;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(99, 102, 241, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
            font-family: 'Poppins', sans-serif;
            color: #d9dddc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Navbar Section */
        .container-navbar {
            height: 10vh;
            min-height: 60px;
            padding: 0 5%;
        }

        .ul-navbar {
            list-style-type: none;
            height: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
        }

        .home-navbar {
            text-decoration: none;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .home-navbar:hover {
            transform: scale(1.2);
        }

        .li-navbar {
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .li-navbar:hover {
            transform: scale(1.2);
        }

        .hr-navbar {
            border: none;
            height: 1px;
            background: linear-gradient(90deg, gray, transparent);
        }

        /* Main Content Section */
        .main-content0 {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 20px;
            padding: 30px 20px;
            width: 100%;
        }

        .container-content {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px 32px;
            width: 100%;
            max-width: 720px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .h2-content {
            color: #38bdf8;
            font-size: 1.6rem;
            font-weight: 600;
        }

        .container-content1 {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 720px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .container-content2 {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 720px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .h3-content1 {
            color: #38bdf8;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .hr-content {
            border: none;
            height: 2px;
            background: linear-gradient(90deg, #38bdf8, transparent);
            margin: 20px 0;
        }

        .p-content {
            color: #d9dddc;
            text-align: justify;
            line-height: 1.7;
            font-weight: 300;
            font-size: 0.95rem;
        }
        
        /* Footer Section */
        .container-footer {
            background-color: #070d19;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .p-footer {
            color: #d9dddc;
            text-align: center;
            font-size: 0.85rem;
        }

        /* Responsive Optimization for Mobile (HP) */
        @media (max-width: 600px) {
            .main-content0 {
                padding: 15px 12px;
                gap: 15px;
            }

            .container-content {
                padding: 16px 20px;
            }

            .container-content1 {
                padding: 20px 16px;
            }

            .h2-content {
                font-size: 1.3rem;
            }

            .h3-content1 {
                font-size: 1.1rem;
            }

            .p-content {
                font-size: 0.88rem;
                line-height: 1.6;
                text-align: left; /* Teks paragraf lebih mudah dibaca di layar HP */
            }

            .hr-content {
                margin: 15px 0;
            }
        }
    </style>
</head>
<body>

         <div class="container-content1">

        </div>

    <!-- Footer Start -->
    <div class="container-footer">
        <p class="p-footer">&copy; 2026 Kelompok 7. All rights reserved.</p>
    </div>
    <!-- Footer End -->
</body>
</html>
